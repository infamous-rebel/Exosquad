# =============================================================================
# EXOSQUAD — Local Development Infrastructure
# =============================================================================
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v (removes volumes)

services:
  postgres:
    image: postgres:16-alpine
    container_name: exosquad-postgres
    environment:
      POSTGRES_USER: exosquad
      POSTGRES_PASSWORD: exosquad_dev
      POSTGRES_DB: exosquad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exosquad"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: exosquad-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
